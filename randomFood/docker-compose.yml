services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: food-roulette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: food_roulette
      POSTGRES_PASSWORD: food_roulette_dev
      POSTGRES_DB: food_roulette
    ports:
      - "5433:5432"
    volumes:
      - food_roulette_pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_roulette -d food_roulette"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-roulette-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://food_roulette:food_roulette_dev@postgres:5432/food_roulette?schema=public

volumes:
  food_roulette_pgdata:
